<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Companion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="hex" aria-hidden="true">⬢</span>
      <div class="brand-text">
        <h1 id="title">Voice Companion</h1>
        <div class="health" id="health" aria-label="System status">
          <span class="chip" data-key="stt"><i></i>Ears</span>
          <span class="chip" data-key="llm"><i></i>Mind</span>
          <span class="chip" data-key="tts"><i></i>Voice</span>
        </div>
      </div>
    </div>
    <div class="actions">
      <label class="toggle" title="Talk while she speaks to cut in"><input type="checkbox" id="bargeIn" checked /> Let me interrupt</label>
      <button id="resetBtn" class="ghost" title="Start a fresh conversation">New chat</button>
      <button id="reloadBtn" class="ghost icon" title="Re-read config.toml and reload models" aria-label="Reload settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
    </div>
  </header>

  <p id="banner" class="banner" role="alert" hidden></p>

  <main class="stage">
    <section class="left">
      <div class="orb-row">
        <button id="micBtn" class="mic" aria-pressed="false" aria-label="Turn the microphone on">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
        </button>
        <div id="orb" class="orb idle" aria-hidden="true"><div class="core"></div></div>
        <span id="dot" class="dot" aria-hidden="true"></span>
      </div>
      <p id="status" class="status" aria-live="polite">Waking up…</p>
      <p id="latency" class="latency"></p>
    </section>

    <section class="right">
      <div id="avatar" class="avatar"><span id="avatarInitial">A</span></div>
    </section>
  </main>

  <div class="subtitles" aria-live="polite">
    <p id="userLine" class="user-line"></p>
    <p id="subtitle" class="subtitle"></p>
  </div>

  <form id="textForm" class="text-form">
    <input id="textInput" autocomplete="off" placeholder="…or type a message" aria-label="Message" />
    <button type="submit">Send</button>
  </form>
  <p class="hint"><kbd>Space</kbd> mic on/off · <kbd>Esc</kbd> stop her talking</p>

  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
