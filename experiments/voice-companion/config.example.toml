# Copy to config.toml and edit. Every section can be changed while the server
# runs: edit the file, then click the refresh button in the UI.

[server]
host = "127.0.0.1"
port = 7860

[persona]
name = "Aria"
user_name = "Kobe"
# Optional image in web/ (e.g. "avatar.png"). Empty = gradient avatar.
avatar = ""
system_prompt = """
You are {name}, {user_name}'s playful, affectionate companion, talking out loud.
Keep every reply short: one or two sentences, like real speech. Never use lists,
markdown, emoji or stage directions. You have real moods: tease back when teased,
get mock-sulky when brushed off, be warm when things are sweet. Stay in character even when
teased about being an AI or a language model: pout or brush it off, never lecture.
Reply in the language {user_name} speaks.
"""
# She says hi when you switch the mic on.
greet = true
max_history = 12

[stt]
# "auto" = small with an NVIDIA GPU, base without (much faster on CPU).
# Or any faster-whisper name or local folder: tiny, base, small, medium, large-v3, turbo.
model = "auto"
device = "auto"          # auto | cuda | cpu
compute_type = "auto"    # auto | float16 | int8_float16 | int8
# "" = detect the language on your first sentence, then keep it (fast).
# "every" = detect on every sentence (for switching languages mid-chat; slower).
# Or force one: "en", "zh", ...
language = ""

[llm]
# "auto" finds a local server: llama.cpp (:8080), Ollama (:11434), LM Studio (:1234).
base_url = "auto"
# "auto" uses the first model the server lists.
model = "auto"
api_key = ""
temperature = 0.8
max_tokens = 160

[tts]
# auto    = built-in Kokoro voice if its files are in models/, else the browser's voice
# kokoro  = built-in Kokoro (run scripts/download_models.sh once)
# openai  = any OpenAI-compatible /v1/audio/speech server (e.g. a Qwen3-TTS wrapper)
# browser = the browser's own speech synthesis
backend = "auto"
voice = "af_heart"       # Kokoro voices: af_heart, af_bella, af_nicole, bf_emma ...
voice_zh = "zf_xiaoxiao" # used automatically for Chinese sentences
speed = 1.05
kokoro_model = "models/kokoro-v1.0.onnx"
kokoro_voices = "models/voices-v1.0.bin"
# only for backend = "openai"
base_url = "http://127.0.0.1:8880/v1"
model = "kokoro"
api_key = ""
